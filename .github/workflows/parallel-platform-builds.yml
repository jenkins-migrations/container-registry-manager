name: Parallel Platform Builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test on ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
          - label: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        # actions/checkout v4 pinned to the v4 tag commit for supply-chain safety.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build on Linux
        if: ${{ matrix.label == 'linux' }}
        shell: bash
        run: |
          echo "Linux build"
          ls -la

      - name: Build on Windows
        if: ${{ matrix.label == 'windows' }}
        shell: pwsh
        run: |
          Write-Host "Windows build"
          Get-ChildItem

      - name: Test on Linux
        if: ${{ matrix.label == 'linux' }}
        shell: bash
        run: echo "Linux test"

      - name: Test on Windows
        if: ${{ matrix.label == 'windows' }}
        shell: pwsh
        run: Write-Host "Windows test"
